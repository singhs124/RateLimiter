services:
  redis:
    image: redis:7-alpine
    container_name: redis-limiter
    ports:
      - "6379:6379"
    #environment:
    #  - REDIS_ARGS=--save 60 1
  app:
    build: .
    container_name: rate-limiter-spring-boot-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379